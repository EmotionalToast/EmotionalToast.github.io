<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmotionalToast</title>
<meta name="description" content="EmotionalToast's personal project library.">
<meta name="theme-color" content="#26272a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <nav class="nav" aria-label="Site">
    <a href="#projects">Projects</a>
    <a href="https://github.com/EmotionalToast">GitHub</a>
  </nav>

  <h1 class="name"><img src="images/logo.png" alt="EmotionalToast" width="785" height="125"></h1>
  <p class="sub">Personal Projects</p>

  <a class="cta" href="#projects">
    Browse projects
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </a>
</header>

<main class="projects" id="projects">
  <div class="section-head">
    <h2>Projects</h2>
    <span id="count">Loading…</span>
  </div>

  <!--
    HOW PROJECTS SHOW UP
    Every folder inside /projects becomes a card automatically. Each folder needs
    an index.html (that is the page the card opens). To remove a project, delete
    its folder. Folders starting with "." or "_" are ignored.

    Optional: put a project.json in the folder to set how the card looks:
      { "title": "My Project", "description": "One line about it.",
        "tags": ["Tag one", "Tag two"], "order": 1 }
    Without it, the card uses the folder name as the title.
  -->
  <div class="cards" id="cards" aria-live="polite"></div>
  <p class="status" id="status" hidden></p>
  <noscript><p class="status">This page needs JavaScript to list the projects.</p></noscript>
</main>

<footer>
  Made by <a href="https://github.com/EmotionalToast">EmotionalToast</a>
</footer>

<script src="js/app.js"></script>

</body>
</html>
